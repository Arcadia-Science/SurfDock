[project]
name = "surfdock"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "arcadia-apb[modal]>=0.3.0",
    "biopython>=1.86",
    "cuequivariance",
    "cuequivariance-torch",
    "e3nn>=0.6.0",
    "ipython>=9.11.0",
    "loguru>=0.7.3",
    "mdanalysis>=2.10.0",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "plyfile>=1.1.3",
    "prefetch-generator>=1.0.3",
    "pyvista>=0.47.1",
    "rdkit>=2025.9.6",
    "scipy>=1.17.1",
    "torch==2.9.0",
    "torch-ema>=0.3",
    "torch-geometric>=2.7.0",
    "typer>=0.24.1",
    "wandb>=0.25.1",
    "torch-scatter>=2.1.2",
    "torch-sparse>=0.6.18",
    "torch-cluster>=1.6.3",
    "torch-spline-conv>=1.2.2",
    "spyrmsd>=0.9.0",
    "optuna>=4.8.0",
    "tensorboard>=2.20.0",
    "setuptools<82",
]

[[tool.uv.index]]
name = "pyg-cpu"
url = "https://data.pyg.org/whl/torch-2.9.0+cpu.html"
explicit = true
format = "flat"

[tool.uv.sources]
torch-scatter = { index = "pyg-cpu" }
torch-sparse = { index = "pyg-cpu" }
torch-cluster = { index = "pyg-cpu" }
torch-spline-conv = { index = "pyg-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
